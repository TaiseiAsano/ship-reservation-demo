<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship スペース予約 – スマホ表示プレビュー</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #E8EAED; font-family: system-ui, sans-serif; }
  .phone { width: 390px; height: 800px; border-radius: 44px; background: #111; padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 32px; background: #fff; }
</style>
<div class="phone"><iframe id="f" title="スマホ表示"></iframe></div>
<script>
  // phone.html?view=day などで index.html?demo=1 をスマホ幅で表示する
  const q = new URLSearchParams(location.search);
  q.set('demo', '1');
  document.getElementById('f').src = 'index.html?' + q.toString();
</script>
